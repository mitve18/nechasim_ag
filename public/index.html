<!doctype html>
<!--
  index.html - ממשק ה-Web של סוכן החוזים (עברית מלאה, RTL).

  מבנה המסך (לפי עיצוב "AI Contract Agent" מ-Claude Design):
    - סרגל צד: מותג, שיחה חדשה, חיפוש, רשימת החוזים בדרייב, העלאה וסנכרון.
    - אזור ראשי: צ'אט עם הסוכן (Streaming), צ'יפים של דוחות מהירים ותיבת כתיבה עם מיקוד בחוזה.
    - חלון כרטיס חוזה (dialog): מטא-דאטה, מיקוד, ניסיון אינדוקס חוזר ומחיקה.

  הדף סטטי לחלוטין ומוגש ע"י FastAPI מתיקיית public - אין שלב Build ואין צורך
  בשרת נוסף ב-Render. ספריות: marked (Markdown), DOMPurify (סינון HTML), Lucide (אייקונים).
-->
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>סוכן חוזים | יחידת נכסים</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/lucide-static@0.469.0/font/lucide.css"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <!-- סרגל צד -->
      <aside id="sidebar" class="sidebar" aria-label="חוזים בדרייב">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">§</span>
          <div class="brand-text">
            <div class="brand-title">סוכן חוזים</div>
            <div class="brand-sub">יחידת נכסים</div>
          </div>
        </div>

        <button id="newChatBtn" class="btn-accent" type="button">
          <i class="icon-plus"></i>שיחה חדשה
        </button>

        <div class="search">
          <i class="icon-search" aria-hidden="true"></i>
          <input id="fileSearch" type="search" placeholder="חיפוש חוזה…" />
        </div>

        <div class="files-head">
          <span>חוזים בדרייב</span>
          <span id="fileCount">0</span>
        </div>

        <ul id="fileList" class="file-list" aria-live="polite"></ul>

        <div id="uploadProgress" class="upload-progress" hidden>
          <div class="upload-bar"><i></i></div>
          <span></span>
        </div>

        <input
          id="fileInput"
          type="file"
          accept=".pdf,.png,.jpg,.jpeg,.tif,.tiff,.webp"
          multiple
          hidden
        />
        <button
          id="uploadBtn"
          class="btn-upload"
          type="button"
          title="או גרור קבצים לסרגל · PDF / תמונות סרוקות"
        >
          <i class="icon-upload"></i>העלאת חוזה
        </button>

        <div class="sync">
          <button
            id="syncBtn"
            class="sync-btn"
            type="button"
            title="סנכרון Delta מול הדרייב"
          >
            <i class="icon-refresh-cw"></i>
          </button>
          <div id="syncInfo" class="sync-info"></div>
        </div>
      </aside>

      <!-- צ'אט -->
      <main class="chat" aria-label="צ'אט עם הסוכן">
        <div id="messages" class="messages" aria-live="polite">
          <div id="messageList" class="message-list"></div>
        </div>

        <template id="emptyStateTpl">
          <div class="empty-state">
            <div class="empty-title">שלום, במה אפשר לעזור?</div>
            <div class="empty-sub">
              שאל על כל חוזה בתיקייה: צדדים, תוקף, דמי שכירות, גוש/חלקה, אופציות
              וסעיפים מיוחדים.
            </div>
          </div>
        </template>

        <button id="jumpBtn" class="jump-btn" type="button" hidden>
          <i class="icon-arrow-down"></i>הודעה חדשה
        </button>

        <div class="composer-area">
          <div class="quick-actions">
            <!-- data-report: נשלף ישירות מ-SQL (0 טוקנים) · data-analysis: דורש LLM -->
            <button
              class="chip"
              data-report="expiring"
              title="מיידי, ללא עלות טוקנים"
            >
              <i class="icon-hourglass"></i>חוזים שמסתיימים
            </button>
            <button
              class="chip"
              data-report="financial"
              title="מיידי, ללא עלות טוקנים"
            >
              <i class="icon-banknote"></i>תנאים כספיים
            </button>
            <button
              class="chip"
              data-report="status"
              title="מיידי, ללא עלות טוקנים"
            >
              <i class="icon-activity"></i>סטטוס אינדקס
            </button>
            <button
              class="chip"
              data-analysis="risks"
              title="ניתוח AI של סעיפי החוזים"
            >
              <i class="icon-triangle-alert"></i>סעיפי סיכון
            </button>
          </div>

          <form id="chatForm" class="composer">
            <div id="focusBar" class="focus-bar" hidden></div>
            <div class="composer-row">
              <textarea
                id="chatInput"
                rows="1"
                placeholder="כתוב שאלה על החוזים…"
              ></textarea>
              <button id="sendBtn" class="send-btn" type="submit" title="שליחה">
                <i class="icon-arrow-up"></i>
              </button>
            </div>
          </form>
          <div class="composer-hint">Enter לשליחה · Shift+Enter לשורה חדשה</div>
        </div>
      </main>
    </div>

    <!-- כרטיס חוזה: מטא-דאטה מקומי, ללא LLM -->
    <dialog id="fileDialog" class="file-dialog">
      <form method="dialog" class="dialog-head">
        <h3 id="fdTitle"></h3>
        <button class="icon-btn" aria-label="סגירה">
          <i class="icon-x"></i>
        </button>
      </form>
      <dl id="fdMeta" class="meta-grid"></dl>
      <div class="dialog-actions">
        <button id="fdFocus" class="btn-accent" type="button">
          <i class="icon-paperclip"></i>שאל על החוזה הזה
        </button>
        <a id="fdLink" class="btn-ghost" target="_blank" rel="noopener"
          ><i class="icon-external-link"></i>פתח בדרייב</a
        >
        <button id="fdReindex" class="btn-ghost" type="button" hidden>
          <i class="icon-refresh-cw"></i>נסה לאנדקס שוב
        </button>
        <button id="fdDelete" class="btn-ghost danger" type="button">
          <i class="icon-trash-2"></i>מחיקה
        </button>
      </div>
    </dialog>

    <!-- אשף מסמכים: טיוטה שהסוכן הכין -> עריכה -> שמירה ל-Word (ללא LLM) -->
    <dialog id="draftDialog" class="file-dialog draft-dialog">
      <form method="dialog" class="dialog-head">
        <input
          id="draftTitle"
          class="draft-title"
          type="text"
          maxlength="200"
          aria-label="כותרת המסמך"
        />
        <button class="icon-btn" aria-label="סגירה">
          <i class="icon-x"></i>
        </button>
      </form>
      <div class="draft-toolbar" role="toolbar" aria-label="עיצוב טקסט">
        <button type="button" class="icon-btn" data-cmd="bold" title="מודגש">
          <i class="icon-bold"></i>
        </button>
        <button type="button" class="icon-btn" data-cmd="italic" title="נטוי">
          <i class="icon-italic"></i>
        </button>
        <button
          type="button"
          class="icon-btn"
          data-cmd="underline"
          title="קו תחתון"
        >
          <i class="icon-underline"></i>
        </button>
        <span class="draft-sep"></span>
        <button
          type="button"
          class="icon-btn"
          data-cmd="formatBlock"
          data-arg="h2"
          title="כותרת"
        >
          <i class="icon-heading-2"></i>
        </button>
        <button
          type="button"
          class="icon-btn"
          data-cmd="formatBlock"
          data-arg="p"
          title="פסקה רגילה"
        >
          <i class="icon-pilcrow"></i>
        </button>
        <button
          type="button"
          class="icon-btn"
          data-cmd="insertUnorderedList"
          title="רשימת תבליטים"
        >
          <i class="icon-list"></i>
        </button>
        <button
          type="button"
          class="icon-btn"
          data-cmd="insertOrderedList"
          title="רשימה ממוספרת"
        >
          <i class="icon-list-ordered"></i>
        </button>
        <span class="draft-sep"></span>
        <button
          type="button"
          class="icon-btn"
          data-cmd="undo"
          title="ביטול פעולה"
        >
          <i class="icon-undo-2"></i>
        </button>
        <button
          type="button"
          class="icon-btn"
          data-cmd="redo"
          title="ביצוע מחדש"
        >
          <i class="icon-redo-2"></i>
        </button>
      </div>
      <div
        id="draftEditor"
        class="draft-editor"
        contenteditable="true"
        dir="rtl"
        spellcheck="false"
        role="textbox"
        aria-multiline="true"
        aria-label="תוכן המסמך"
      ></div>
      <div class="dialog-actions">
        <button id="draftSave" class="btn-accent" type="button">
          <i class="icon-file-down"></i>שמירה ל-Word
        </button>
        <button id="draftCancel" class="btn-ghost" type="button">סגירה</button>
        <span class="draft-hint"
          >השינויים נשמרים בטיוטה עד שתסגור את השיחה</span
        >
      </div>
    </dialog>

    <div id="toast" class="toast" role="status" hidden></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
